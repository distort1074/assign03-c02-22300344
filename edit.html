<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>도서 정보 수정 | 책장</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="my.css">
  <script src="js/app.js" defer></script>
</head>
<body data-page="edit">
  <a class="skip-link" href="#main">본문으로 이동</a>
  <header class="site-header"><nav class="container nav-layout" aria-label="주 메뉴">
    <a class="brand" href="index.html"><span class="brand-icon" aria-hidden="true">冊</span> 책장 <small>BOOK SHELF</small></a>
    <div class="nav-links"><a href="index.html" >도서 목록</a><a href="example.html" >Bootstrap 예제</a><a class="btn btn-primary" href="add.html">+ 도서 추가</a></div>
  </nav></header>
  <main id="main" class="container main-layout"><a class="back-link" href="index.html">← 도서 목록</a><div class="page-heading"><div><p class="eyebrow">EDIT BOOK</p><h1>도서 정보 수정</h1><p class="muted">책의 정보와 독서 상태를 수정하세요.</p></div></div><div id="page-message" role="alert"></div><section class="card form-card"><p class="muted"><span class="required">*</span> 표시는 필수 입력 항목입니다.</p><form id="book-form" novalidate><div class="row g-4"><div class="col-md-6"><label class="form-label" for="title">도서명 <span class="required">*</span></label><input class="form-control" id="title" name="title" type="text" required minlength="2" maxlength="100" aria-describedby="title-help title-error"><div class="form-text" id="title-help">2~100자</div><div class="invalid-feedback" id="title-error"></div></div>
<div class="col-md-6"><label class="form-label" for="author">저자 <span class="required">*</span></label><input class="form-control" id="author" name="author" type="text" required maxlength="50" aria-describedby="author-help author-error"><div class="form-text" id="author-help">1~50자</div><div class="invalid-feedback" id="author-error"></div></div>
<div class="col-md-6"><label class="form-label" for="publisher">출판사 <span class="required">*</span></label><input class="form-control" id="publisher" name="publisher" type="text" required maxlength="80" aria-describedby="publisher-help publisher-error"><div class="form-text" id="publisher-help">1~80자</div><div class="invalid-feedback" id="publisher-error"></div></div>
<div class="col-md-6"><label class="form-label" for="year">출판년도 <span class="required">*</span></label><input class="form-control" id="year" name="year" type="number" required min="1450" max="2100" step="1" aria-describedby="year-help year-error"><div class="form-text" id="year-help">1450~2100 사이의 정수</div><div class="invalid-feedback" id="year-error"></div></div>
<div class="col-md-6"><label class="form-label" for="isbn">ISBN <span class="required">*</span></label><input class="form-control" id="isbn" name="isbn" type="text" required inputmode="numeric" maxlength="13" pattern="[0-9]{13}" aria-describedby="isbn-help isbn-error"><div class="form-text" id="isbn-help">하이픈 없이 숫자 13자리</div><div class="invalid-feedback" id="isbn-error"></div></div>
<div class="col-md-6"><label class="form-label" for="category">카테고리 <span class="required">*</span></label><select class="form-select" name="category" id="category" required aria-describedby="category-error"><option value="">선택하세요</option><option>문학</option><option>IT / 기술</option><option>인문 / 사회</option><option>자기계발</option><option>기타</option></select><div class="invalid-feedback" id="category-error"></div></div>
<div class="col-md-6"><label class="form-label" for="status">독서 상태 <span class="required">*</span></label><select class="form-select" name="status" id="status" required aria-describedby="status-error"><option value="">선택하세요</option><option>읽고 싶어요</option><option>읽는 중</option><option>완독</option></select><div class="invalid-feedback" id="status-error"></div></div>
<div class="col-md-6"><label class="form-label" for="addedDate">등록일 <span class="required">*</span></label><input class="form-control" id="addedDate" name="addedDate" type="date" required aria-describedby="addedDate-error"><div class="invalid-feedback" id="addedDate-error"></div></div><div class="col-12"><label class="form-label" for="memo">메모</label><textarea class="form-control" name="memo" id="memo" rows="4" maxlength="500" aria-describedby="memo-help memo-error" placeholder="책에 대한 생각을 남겨보세요."></textarea><div class="form-text" id="memo-help">최대 500자, 선택 입력</div><div class="invalid-feedback" id="memo-error"></div></div></div><div class="form-actions"><a class="btn btn-outline-secondary" id="cancel-link" href="index.html">취소</a><button class="btn btn-primary" type="submit">수정</button></div></form></section></main>
  <footer class="container site-footer"><span>책장 · 나의 작은 도서관리 서비스</span><span>Open Source Studio · 배산 22300344</span></footer>
</body>
</html>
